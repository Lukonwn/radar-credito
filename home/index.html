<style>
:root {
  --red: #e50924;
  --deep: #270006;
  --pink: #ff6579;
  --white: #fff7f5;
  --green: #00d95f;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 35px 20px;
  font-family: 'Montserrat', sans-serif;
  color: var(--white);
  background:
    radial-gradient(ellipse at 50% 40%, rgba(190,0,35,.35), transparent 55%),
    radial-gradient(ellipse at 0% 100%, rgba(255,25,55,.22), transparent 40%),
    linear-gradient(145deg, #4c000d 0%, #190004 48%, #39000a 100%);
  position: relative;
  isolation: isolate;
}

/* TEXTURA DE LUZ */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .35;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.12) 1px, transparent 2px),
    radial-gradient(circle at 80% 70%, rgba(255,150,150,.12) 1px, transparent 2px);
  background-size: 65px 65px;
}

/* ILUMINAÇÃO */
.ambient {
  position: fixed;
  width: 420px;
  height: 420px;
  left: 50%;
  top: 45%;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  background: rgba(255,0,45,.15);
  filter: blur(110px);
  z-index: -1;
  pointer-events: none;
}

/* BRILHOS */
.light {
  position: fixed;
  width: 180px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #ff8998, transparent);
  box-shadow: 0 0 18px #ff334f;
  transform: rotate(-40deg);
  opacity: .7;
  pointer-events: none;
}

.light.one {
  top: 13%;
  left: -35px;
}

.light.two {
  bottom: 15%;
  right: -45px;
}

/* PARTÍCULAS */
.particles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: -1;
}

.particle {
  position: absolute;
  color: rgba(255,100,120,.65);
  animation: float 8s ease-in-out infinite;
  text-shadow: 0 0 15px rgba(255,0,50,.7);
}

.particle:nth-child(1) {
  left: 9%;
  top: 18%;
  font-size: 20px;
}

.particle:nth-child(2) {
  right: 12%;
  top: 28%;
  font-size: 14px;
  animation-delay: 2s;
}

.particle:nth-child(3) {
  left: 15%;
  bottom: 18%;
  font-size: 13px;
  animation-delay: 3s;
}

.particle:nth-child(4) {
  right: 9%;
  bottom: 25%;
  font-size: 22px;
  animation-delay: 1s;
}

@keyframes float {
  0%,100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-22px) rotate(12deg); }
}

/* CONTEÚDO */
.container {
  width: 100%;
  max-width: 500px;
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 35px 25px;
  border-radius: 28px;
  border: 1px solid rgba(255,130,145,.14);
  background: linear-gradient(
    145deg,
    rgba(90,0,17,.25),
    rgba(20,0,5,.25)
  );
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow:
    0 25px 90px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.07);
}

/* CORAÇÃO */
.heart {
  font-size: 48px;
  display: inline-block;
  margin-bottom: 5px;
  filter: drop-shadow(0 0 15px rgba(255,20,65,.8));
  animation: heartbeat 2s infinite;
}

@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  10% { transform: scale(1.15); }
  20% { transform: scale(1); }
  30% { transform: scale(1.12); }
  40% { transform: scale(1); }
}

/* NOME */
.name {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(65px, 13vw, 88px);
  font-weight: 400;
  line-height: 1.1;
  margin-bottom: 18px;
  color: #fff6f4;
  text-shadow:
    0 0 12px rgba(255,255,255,.18),
    0 0 30px rgba(255,40,70,.3);
}

.name span {
  color: #ff536c;
  display: block;
  font-size: 1.05em;
}

/* TEXTO */
.welcome {
  font-size: 19px;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 14px;
  color: #fff7f5;
}

.welcome span {
  color: #ff647a;
}

.description {
  max-width: 360px;
  margin: 0 auto 35px;
  color: rgba(255,240,240,.83);
  font-size: 14px;
  line-height: 1.9;
  font-weight: 400;
}

/* BOTÃO WHATSAPP */
.whatsapp-button {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  width: 100%;
  min-height: 76px;
  padding: 18px 16px;
  border-radius: 60px;
  text-decoration: none;
  color: #fff;
  background: linear-gradient(110deg, #008d38, #00db60, #00a943);
  border: 2px solid rgba(220,255,225,.9);
  font-size: clamp(13px, 3.5vw, 16px);
  font-weight: 800;
  letter-spacing: .3px;
  box-shadow:
    0 0 12px rgba(0,255,90,.7),
    0 0 30px rgba(0,255,90,.45),
    0 0 65px rgba(0,255,90,.18),
    inset 0 1px 0 rgba(255,255,255,.35);
  animation: greenPulse 2s ease-in-out infinite;
  transition: transform .25s, filter .25s;
  -webkit-tap-highlight-color: transparent;
}

.whatsapp-button:hover {
  transform: translateY(-3px) scale(1.02);
  filter: brightness(1.12);
}

.whatsapp-button:active {
  transform: scale(.97);
}

.whatsapp-button svg {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  fill: white;
}

.arrow {
  font-size: 30px;
  line-height: 1;
  font-weight: 400;
}

@keyframes greenPulse {
  0%,100% {
    box-shadow:
      0 0 12px rgba(0,255,90,.6),
      0 0 30px rgba(0,255,90,.3);
  }
  50% {
    box-shadow:
      0 0 22px rgba(0,255,90,.9),
      0 0 50px rgba(0,255,90,.55),
      0 0 75px rgba(0,255,90,.2);
  }
}

/* RODAPÉ */
.romantic {
  margin-top: 29px;
  color: rgba(255,220,225,.8);
  font-family: 'Great Vibes', cursive;
  font-size: 29px;
}

.footer {
  margin-top: 24px;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.38);
  text-transform: uppercase;
}

/* CELULARES */
@media(max-width: 480px) {
  body {
    padding: 20px 14px;
  }

  .container {
    padding: 35px 20px;
  }

  .description {
    font-size: 13px;
  }

  .whatsapp-button {
    min-height: 70px;
    gap: 9px;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
