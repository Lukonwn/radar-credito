    :root {
      --bg: #07130c;

      --muted: #b7c1b9;
      --grid: rgba(174, 225, 132, .075);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      color: #f7faf6;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(112, 190, 23, .25), transparent 34%),
        radial-gradient(ellipse at 88% 78%, rgba(54, 130, 30, .18), transparent 36%),
        linear-gradient(145deg, #0b1b10 0%, #06100a 52%, #09170d 100%);
      position: relative;
      isolation: isolate;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 58px 58px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.95), rgba(0,0,0,.55));
    }
    body::after {
      content: "";
      position: fixed;
      width: 340px;
      height: 340px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(137, 218, 24, .10);
      filter: blur(95px);
      z-index: -1;
      pointer-events: none;
    }
    main {
      width: min(100%, 430px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .cta {

      align-items: center;
      justify-content: center;
      gap: 12px;
      width: min(100%, 350px);
      min-height: 68px;
      padding: 18px 26px;
      border: 1px solid rgba(225, 255, 133, .95);
      border-radius: 999px;
      color: #102006;
      background: linear-gradient(105deg, #a5e51c 0%, #c8ff35 52%, #a9ed25 100%);
      text-decoration: none;
      text-align: center;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 850;
      letter-spacing: .2px;
      box-shadow: 0 0 12px rgba(183,245,43,.58), 0 0 34px rgba(145,218,29,.34), inset 0 1px 0 rgba(255,255,255,.55);
      animation: pulse 1.8s ease-in-out infinite;
      transition: transform .2s ease, filter .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .cta:hover { transform: translateY(-2px) scale(1.015); filter: brightness(1.07); }
    .cta:active { transform: scale(.985); }
    .telegram-icon { width: 23px; height: 23px; flex: 0 0 23px; fill: currentColor; }
    .arrow { font-size: 25px; line-height: 0; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 10px rgba(183,245,43,.48), 0 0 24px rgba(145,218,29,.24), inset 0 1px 0 rgba(255,255,255,.48); }
      50% { box-shadow: 0 0 20px rgba(183,245,43,.9), 0 0 48px rgba(145,218,29,.55), 0 0 72px rgba(145,218,29,.18), inset 0 1px 0 rgba(255,255,255,.62); }
